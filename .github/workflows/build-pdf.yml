name: Build Resume PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: Denis_Kozhevnikov_CV.md
          output_path: Denis_Kozhevnikov_CV.pdf
          image_imports: true

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: Denis_Kozhevnikov_CV.pdf
